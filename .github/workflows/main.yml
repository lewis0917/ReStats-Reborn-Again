name: Build Package

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install lz4 xz

      - name: Checkout Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone --recursive https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphoneos:clang:latest:15.0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReStats-Debian-Package
          path: packages/*.deb
