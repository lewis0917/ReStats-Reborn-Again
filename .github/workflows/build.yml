name: Build ReStats

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    # macOS gives us Xcode's clang at exactly the path Theos expects.
    # Linux requires a separate iOS cross-compilation toolchain download
    # (theos/toolchain) that doesn't ship with the Theos clone — skipping
    # that entire problem by running on macOS where it's already there.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ldid fake-signs the dylib before dpkg-deb runs.
      # Theos ships ldid2 in its vendor dir but brew ldid is more reliable
      # on the macOS runner image and resolves PATH without extra config.
      - name: Install ldid
        run: brew install ldid

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-${{ runner.os }}-v1

      - name: Clone Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth=1 \
            https://github.com/theos/theos.git ~/theos

      # SDKs cached separately — a Theos update won't blow them away.
      - name: Cache SDKs
        id: cache-sdks
        uses: actions/cache@v4
        with:
          path: ~/theos/sdks
          key: theos-sdks-v1

      - name: Install SDKs
        if: steps.cache-sdks.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          mv /tmp/theos-sdks/*.sdk ~/theos/sdks/
          rm -rf /tmp/theos-sdks

      - name: Build
        env:
          # macOS runner home is /Users/runner, not /home/runner
          THEOS: /Users/runner/theos
        run: |
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ReStats-deb
          path: packages/*.deb
          if-no-files-found: error
